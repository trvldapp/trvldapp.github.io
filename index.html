<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Get trvld</title>
<meta name="apple-itunes-app" content="app-id=6769585781">
<meta property="og:title" content="trvld — Rank Your Travels">
<meta property="og:image" content="https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/f4/43/a3/f443a309-5447-44bb-01c7-7c19c4e97fcd/AppIcon-0-0-1x_U007epad-0-1-0-85-220.png/512x512bb.jpg">
<link rel="apple-touch-icon" href="https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/f4/43/a3/f443a309-5447-44bb-01c7-7c19c4e97fcd/AppIcon-0-0-1x_U007epad-0-1-0-85-220.png/512x512bb.jpg">
<style>
  :root { --bg: #F4EFE6; --ink: #1A1A1A; --muted: #6B655C; --red: #E2372B; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg); color: var(--ink); text-align: center;
    font-family: -apple-system, system-ui, sans-serif; padding: 24px;
  }
  .icon { width: 120px; height: 120px; border-radius: 27px; box-shadow: 0 12px 32px rgba(0,0,0,.15); display: block; }
  h1 { font-size: 22px; font-weight: 700; margin-top: 20px; }
  .status { color: var(--muted); font-size: 15px; margin-top: 6px; }
  .hint { display: none; margin-top: 28px; font-size: 16px; line-height: 1.5; max-width: 300px; }
  .hint b { color: var(--red); }
  .copy { display: none; margin-top: 18px; background: none; border: 1px solid #CFC6B6; border-radius: 10px; padding: 10px 18px; font: 600 15px -apple-system, system-ui, sans-serif; color: var(--ink); }
  .in-app .hint, .in-app .copy { display: block; }
  .arrow { display: none; position: fixed; top: 10px; right: 16px; font-size: 40px; color: var(--red); animation: n 1.1s ease-in-out infinite; }
  .in-app .arrow { display: block; }
  @keyframes n { 50% { transform: translate(3px, -5px); } }
</style>
</head>
<body>
  <div class="arrow" aria-hidden="true">↗</div>
  <a id="iconLink" href="https://apps.apple.com/us/app/trvld-rank-your-travels/id6769585781">
    <img class="icon" alt="trvld app icon" src="https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/f4/43/a3/f443a309-5447-44bb-01c7-7c19c4e97fcd/AppIcon-0-0-1x_U007epad-0-1-0-85-220.png/512x512bb.jpg">
  </a>
  <h1>trvld</h1>
  <p class="status" id="status">Opening the App Store…</p>
  <p class="hint">Tap <b>•••</b> in the top-right corner, then <b>Open in browser</b></p>
  <button class="copy" id="copy">Copy link</button>

<script>
(function () {
  var STORE = "https://apps.apple.com/us/app/trvld-rank-your-travels/id6769585781";
  var ua = navigator.userAgent || "";
  var inApp = /musical_ly|BytedanceWebview|TikTok|Instagram|FBAN|FBAV|Snapchat|Twitter|Pinterest|LinkedInApp/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);

  if (!inApp) {
    // Safari / normal browsers: go straight to the App Store.
    location.replace(STORE);
    return;
  }

  // In-app browser: the App Store handoff is blocked here, so try to jump to Safari instead.
  document.body.classList.add("in-app");
  document.getElementById("status").textContent = "Open in Safari to download";

  function toSafari() { if (isIOS) location.href = "x-safari-" + location.href; }
  toSafari();
  document.getElementById("iconLink").addEventListener("click", function (e) { e.preventDefault(); toSafari(); });

  document.getElementById("copy").addEventListener("click", function () {
    var btn = this;
    var ok = function () { btn.textContent = "Copied, paste in Safari"; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(location.href).then(ok, ok);
    } else { ok(); }
  });
})();
</script>
<noscript><p class="status"><a href="https://apps.apple.com/us/app/trvld-rank-your-travels/id6769585781">Download on the App Store</a></p></noscript>
</body>
</html>
